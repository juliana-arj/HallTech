<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | HallTech Web Hosting</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="auth-section">

        <div class="auth-panel auth-panel-form">
            <div class="auth-form-wrapper">

                <a href="../landingPage/index.html" class="logo">
                    <img src="images/logo.png" alt="HallTech Web Hosting">
                </a>

                <div class="auth-mobile-heading">
                    <h1>Bem-vindo(a)!</h1>
                    <p>Sua porta de entrada aqui. Crie sua conta e comece a hospedar seus projetos na nuvem.</p>
                </div>

                <form class="auth-form" id="cadastroForm">
                    <div class="form-group">
                        <label for="fullName">Nome Completo</label>
                        <input type="text" id="fullName" class="form-input" placeholder="Insira seu nome completo"
                            autocomplete="name" required>
                    </div>

                    <div class="form-group">
                        <label for="document">CPF ou CNPJ</label>
                        <input type="text" id="document" class="form-input" placeholder="Insira seu CPF ou CNPJ"
                            required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cadastroEmail">E-mail</label>
                            <input type="email" id="cadastroEmail" class="form-input" placeholder="Insira seu e-mail"
                                autocomplete="email" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Telefone</label>
                            <input type="tel" id="phone" class="form-input" placeholder="Insira seu telefone"
                                autocomplete="tel" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cadastroPassword">Senha</label>
                            <input type="password" id="cadastroPassword" class="form-input"
                                placeholder="Insira sua senha" autocomplete="new-password" required>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirmar Senha</label>
                            <input type="password" id="confirmPassword" class="form-input"
                                placeholder="Confirme sua senha" autocomplete="new-password" required>
                        </div>
                    </div>

                    <label class="form-checkbox">
                        <input type="checkbox" id="rememberMeCadastro">
                        <span>Lembrar de mim</span>
                    </label>

                    <button type="submit" class="btn btn-primary auth-submit">Cadastrar</button>
                </form>

                <p class="auth-switch">Já tem uma conta? <a href="../login/index.html">Fazer login</a></p>

            </div>
        </div>

        <div class="auth-panel auth-panel-banner">

            <svg class="auth-wave auth-wave-back" viewBox="0 0 80 800" preserveAspectRatio="none" aria-hidden="true">
                <path fill="#ffffff"
                    d="M40,0 Q80,50 40,100 Q0,150 40,200 Q80,250 40,300 Q0,350 40,400 Q80,450 40,500 Q0,550 40,600 Q80,650 40,700 Q0,750 40,800 L0,800 L0,0 Z">
                </path>
            </svg>

            <svg class="auth-wave auth-wave-front" viewBox="0 0 80 800" preserveAspectRatio="none" aria-hidden="true">
                <path fill="#ffffff"
                    d="M40,0 Q80,50 40,100 Q0,150 40,200 Q80,250 40,300 Q0,350 40,400 Q80,450 40,500 Q0,550 40,600 Q80,650 40,700 Q0,750 40,800 L0,800 L0,0 Z">
                </path>
            </svg>

            <div class="auth-banner-content">
                <h2>Bem-vindo(a)!</h2>
                <p>Sua porta de entrada aqui. Crie sua conta e comece a hospedar seus projetos na nuvem com a HallTech.
                </p>
            </div>

        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="script.js"></script>

</body>

</html>
